name: Discover library sources
on:
  schedule:
    - cron: '20 11 * * *' # 08:20 Argentina
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore discovery state
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/automation/discovery; then
            git show origin/automation/discovery:maintenance/discovery.json > maintenance/discovery.json
          fi
      - run: npm run content:discover
        id: discovery
        continue-on-error: true
      - name: Save durable state on its own branch
        run: |
          cp maintenance/discovery.json /tmp/discovery.json
          if git show-ref --verify --quiet refs/remotes/origin/automation/discovery; then
            git checkout -f -B automation/discovery origin/automation/discovery
          else
            git checkout -B automation/discovery
          fi
          cp /tmp/discovery.json maintenance/discovery.json
          git add maintenance/discovery.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: record source discovery'
            git push origin HEAD:automation/discovery
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: discovery-report
          path: work/discovery-report.md
          retention-days: 30
      - name: Surface newly unavailable sources
        if: steps.discovery.outcome == 'failure'
        run: |
          echo '::error::Discovery needs attention. Usable state was preserved; see the discovery-report artifact.'
          exit 1
